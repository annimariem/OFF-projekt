services:
  # --- Peamine analüütika andmebaas ---
  analytics-db:
    image: pgduckdb/pgduckdb:18-v1.1.1

    container_name: off-analytics-db

    env_file:
      - .env

    ports:
      - "${POSTGRES_PORT}:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./init:/docker-entrypoint-initdb.d
      - analytics_db_vol:/var/lib/postgresql

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 10s
      retries: 5
      start_period: 5s

  # --- Airflow init ---
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    user: "${AIRFLOW_UID:-50000}:0"
    volumes:
      - .:/opt/project
    command:
      - bash
      - -c
      - |
        id

        for d in logs target dbt_packages; do
          mkdir -p /opt/project/dbt_project/$$d
        done

        cd /opt/project/dbt_project
        dbt deps --profiles-dir .
    restart: "no"

  # --- Airflow container ---
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow

    container_name: off-airflow

    depends_on:
      analytics-db:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    env_file:
      - .env

    ports:
      - "${AIRFLOW_PORT_HOST}:8080"

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      POSTGRES_HOST: analytics-db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./:/opt/project
      - ./airflow/dags:/opt/airflow/dags

    user: "${AIRFLOW_UID:-50000}:0"

    working_dir: /opt/project

    restart: unless-stopped

    command: >
      bash -c "
        airflow db migrate &&
        airflow users create -u ${AIRFLOW_USER} -p ${AIRFLOW_PASSWORD} -f Airflow -l Admin -r Admin -e admin@example.com || true &&
        airflow dag-processor &
        airflow scheduler &
        airflow triggerer &
        airflow api-server
      "

  # --- Superset ühekordne initsialiseerimine (migratsioonid + admin kasutaja) ---
  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset

    container_name: off-superset-init

    env_file:
      - .env

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py

    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/pythonpath
      - ./superset/dashboards:/tmp/dashboards

    command: /bin/bash /app/pythonpath/init_superset.sh

  # --- Apache Superset näidikulaud ---
  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset

    container_name: off-superset

    depends_on:
      superset-init:
        condition: service_completed_successfully

    env_file:
      - .env

    ports:
      - "${SUPERSET_PORT_HOST}:8088"

    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py

    volumes:
      - superset_home:/app/superset_home
      - ./superset:/app/pythonpath

    restart: unless-stopped

    command: >
      /bin/sh -c " superset run -h 0.0.0.0 -p 8088 "

volumes:
  analytics_db_vol:
  superset_home:
